# Application Configuration
spring.application.name=TicketBooking

# Server Configuration
server.port=8080

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jackson.serialization.fail-on-empty-beans=false

# H2 Console Configuration (DISABLE IN PRODUCTION)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Web Resources Configuration
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration (USE ENVIRONMENT VARIABLES IN PRODUCTION; >= 64 bytes for HS512)
app.jwt.secret=${JWT_SECRET:footballtix-dev-jwt-secret-key-change-me-in-production-min-64-bytes-hs512}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth Configuration (SET VIA ENVIRONMENT VARIABLE)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Midtrans Payment Gateway Configuration (SET VIA ENVIRONMENT VARIABLES)
midtrans.server-key=${MIDTRANS_SERVER_KEY:}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:}
midtrans.is-production=${MIDTRANS_IS_PRODUCTION:false}
app.payments.allow-simulation=${PAYMENT_ALLOW_SIMULATION:false}
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500}

# Logging Configuration (DEBUG FOR TROUBLESHOOTING)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.ticketbooking=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
